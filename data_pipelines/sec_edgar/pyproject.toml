[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-edgar-pit-pipeline"
version = "0.1.0"
description = "Point-in-time SEC Company Facts data pipeline for Personal Alpha Library"
requires-python = ">=3.12,<3.13"
dependencies = [
  "exchange-calendars",
  "numpy",
  "pandas",
  "pyarrow",
  "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
